<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Miko & Tomi">
<meta name="theme-color" content="#ffd23f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Miko and Tomi</title>
<style>
:root{--ink:#3a2e2a;--paper:#fffaf0;--card:#ffffff;--line:#eadfca;--sun:#ffd23f;--sun-dark:#e2b400;--leaf:#2f8a57;--sky:#dff3fb;--no:#d6453d;--soft:#7a6a62}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Avenir Next","Segoe UI",Verdana,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:18px;line-height:1.45;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.screen{max-width:980px;margin:0 auto;padding:14px 16px 28px;min-height:100%}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bar h1{font-size:22px;margin:0;flex:1;line-height:1.15}
.pill{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:17px;min-height:44px}
.pill.on{background:var(--sun)}
.big{background:var(--sun);border:2.5px solid var(--ink);border-radius:16px;padding:12px 22px;font-weight:800;font-size:20px;min-height:52px;box-shadow:0 4px 0 var(--ink)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.big.plain{background:var(--card)}
h2{font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--leaf);margin:22px 0 8px}
.today{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;padding:14px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:center}
.today .pic,.page .pic,.row .pic{border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;line-height:0;background:var(--sky)}
.pic svg{width:100%;height:auto;display:block}
.today h3{font-size:26px;margin:0 0 4px;line-height:1.1}
.today p{margin:0 0 12px;color:var(--soft)}
.jobs{display:flex;flex-direction:column;gap:10px}
.job{display:flex;align-items:center;gap:10px}
.tick{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 30px;background:var(--card)}
.tick.done{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px}
.row h3{margin:0 0 8px;font-size:20px}
.row .btns{display:flex;flex-wrap:wrap;gap:8px}
.foot{margin-top:26px;text-align:center}
.foot button{color:var(--soft);text-decoration:underline;font-size:15px;padding:10px}
/* reader */
.page .pic{max-width:min(100%,calc((100vh - 290px) * 2.09));margin:0 auto}
.units{margin:12px auto 0;max-width:820px;font-size:clamp(20px,2.7vw,27px);line-height:1.55}
.unit{display:inline}
.unit.brk::before{content:"";display:block;height:.25em}
.spk{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--sun);border:2px solid var(--ink);margin:0 .28em 0 .1em;vertical-align:-.28em}
.spk svg{width:.85em;height:.85em}
.nb{white-space:nowrap}
.unit.playing .txt{background:#fff0a6;border-radius:6px}
.w{border-radius:6px;padding:0 1px;cursor:pointer}
.w.hit{background:var(--sun);box-shadow:0 0 0 2px var(--sun)}
.w.pw{border-bottom:3px dotted var(--leaf)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dot.on{background:var(--ink)}
.pop{position:fixed;inset:0;background:rgba(58,46,42,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.pop .box{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:14px 18px;text-align:center;width:min(340px,100%)}
.pop .box b{font-size:26px;display:block;margin-top:4px}
/* exercises + deck */
.ex{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.ex h3{margin:0 0 8px;font-size:19px}
.q{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:19px}
.q:first-of-type{border-top:0}
.q .s{flex:1 1 260px;min-width:0}
.opt{border:2px solid var(--ink);border-radius:12px;padding:6px 14px;min-height:42px;background:var(--card);font-weight:700}
.opt.sel{background:var(--sun)}
.q input{font:inherit;border:0;border-bottom:3px solid var(--ink);background:transparent;width:8.5em;padding:2px 4px;border-radius:0;color:var(--ink)}
.q.ok{background:#e9f7ee}.q.bad{background:#fdecea}
.mark{font-weight:800;min-width:1.3em;text-align:center}
.q.ok .mark{color:var(--leaf)}.q.bad .mark{color:var(--no)}
.cardbox{background:var(--card);border:2.5px solid var(--ink);border-radius:22px;padding:22px 18px;text-align:center;max-width:680px;margin:10px auto;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.cardbox .verb{font-size:17px;color:var(--soft);font-weight:700;letter-spacing:.04em}
.cardbox .sent{font-size:clamp(24px,3.6vw,34px);line-height:1.35}
.cardbox .blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--ink);margin:0 .1em}
.cardbox .ans{background:#fff0a6;border-radius:8px;padding:0 .15em;font-weight:800}
.cardbox .jp{font-size:19px;color:var(--soft)}
.cardbox .picw{max-width:260px;margin:0 auto}
.two{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.left{color:var(--soft);text-align:center;font-size:15px}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--card)}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left}
th{background:#f6efe0}
.note{color:var(--soft);font-size:15px}
@media (max-width:640px){.today{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:104px minmax(0,1fr)}.bar h1{font-size:19px}}
@media (orientation:landscape) and (max-height:820px){.page .pic{max-width:min(100%,calc((100vh - 250px) * 2.09))}}
</style>
</head>

0\" rx=\"35\" ry=\"33\" fill=\"#f6d3b3\" stroke=\"#3a2e2a\" stroke-width=\"2.6\"/><ellipse cx=\"-23\" cy=\"15\" rx=\"6.5\" ry=\"4.2\" fill=\"#f7a6a0\" opacity=\".55\"/><ellipse cx=\"23\" cy=\"15\" rx=\"6.5\" ry=\"4.2\" fill=\"#f7a6a0\" opacity=\".55\"/><path d=\"M -18.5 6 Q -13.0 -2 -7.5 6\" fill=\"none\" stroke=\"#3a2e2a\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M 7.5 6 Q 13.0 -2 18.5 6\" fill=\"none\" stroke=\"#3a2e2a\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M -10.5 16 Q 0 34 10.5 16 Z\" fill=\"#7a2f33\" stroke=\"#3a2e2a\" stroke-width=\"2.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><ellipse cx=\"0\" cy=\"23.5\" rx=\"4.4\" ry=\"2.6\" fill=\"#f08a8a\"/><path d=\"M -34 -7 C -35 -41, 35 -41, 34 -7 C 22 -16, 8 -18, 0 -17 C -8 -18, -22 -16, -34 -7 Z\" fill=\"#2c2a35\" stroke=\"#3a2e2a\" stroke-width=\"2.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M -34 -8 C -41 2, -40 18, -34 25 C -29 22, -28 8, -29 -8 Z\" fill=\"#2c2a35\" stroke=\"#3a2e2a\" stroke-width=\"2.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M 34 -8 C 41 2, 40 18, 34 25 C 29 22, 28 8, 29 -8 Z\" fill=\"#2c2a35\" stroke=\"#3a2e2a\" stroke-width=\"2.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><g transform=\"scale(1 1)\"><rect x=\"14\" y=\"-19\" width=\"13\" height=\"6\" rx=\"3\" fill=\"#ffcf3f\" stroke=\"#3a2e2a\" stroke-width=\"2\" transform=\"rotate(-14 20 -16)\"/><\/g><\/g><\/g><\/g><\/g><\/g><text x=\"172\" y=\"52\" text-anchor=\"middle\" font-family=\"Verdana, sans-serif\" font-weight=\"700\" font-size=\"27\" fill=\"#3a2e2a\">Ha<\/text><text x=\"180\" y=\"88\" text-anchor=\"middle\" font-family=\"Verdana, sans-serif\" font-weight=\"700\" font-size=\"27\" fill=\"#3a2e2a\">ha!<\/text><\/svg>", "audio": "laugh", "label": "picture: laugh", "jp": ""}]};
const KEY = "mt.v1", STEPS = [0, 1, 2, 4, 7, 14], NEW_PER_DAY = 8;
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
let state = { cards: {}, ex: {}, read: {} };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const slug = w => w.toLowerCase().replace(/[^a-z]/g, "");
const SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#3a2e2a"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#3a2e2a" stroke-width="2" stroke-linecap="round"/></svg>';

/* ---- sound: one player; a word is said slowly, then at normal speed ---- */
const player = new Audio(); let slow = false, queue = [], onDone = null;
player.addEventListener("ended", () => { const n = queue.shift(); if (n) start(n); else if (onDone) { const f = onDone; onDone = null; f(); } });
player.addEventListener("error", () => { queue = []; if (onDone) { const f = onDone; onDone = null; f(); } });
function start(job) { player.src = job.src; player.playbackRate = job.rate; player.play().catch(() => {}); }
function say(jobs, done) { player.pause(); queue = jobs.slice(1); onDone = done || null; start(jobs[0]); }
const sayUnit = (story, a, done) => say([{ src: "audio/" + story + "/" + a + ".mp3", rate: slow ? 0.78 : 1 }], done);
const sayWord = (story, w, done) => { const src = "audio/" + story + "/w/" + slug(w) + ".mp3"; say([{ src, rate: 0.7 }, { src, rate: 1 }], done); };

/* ---- home ---- */
function dueCards() {   // cards that are due, plus a few new ones — never the whole deck on day one
  const t = today(), back = DATA.deck.filter(c => state.cards[c.id] && state.cards[c.id].due <= t);
  const room = Math.max(0, NEW_PER_DAY - Object.values(state.cards).filter(s => s.first === t).length);
  return back.concat(DATA.deck.filter(c => !state.cards[c.id]).slice(0, room));
}
function home() {
  const s = DATA.stories.find(x => x.recommended) || DATA.stories[0], t = today();
  const readToday = (state.read[s.id] || []).includes(t), due = dueCards().length;
  const practised = Object.values(state.cards).some(c => c.last === t);
  app.innerHTML = `<div class="bar"><h1>Miko and Tomi</h1></div>
  <h2>Today</h2>
  <div class="today"><div class="pic">${s.cover}</div><div>
    <h3>${esc(s.title)}</h3><p>${s.pages.length} pages · listen and read</p>
    <div class="jobs">
      <div class="job"><span class="tick ${readToday ? "done" : ""}">${readToday ? "✓" : "1"}</span><button class="big" data-go="story:${s.id}">Read the story</button></div>
      <div class="job"><span class="tick ${practised && !due ? "done" : ""}">${practised && !due ? "✓" : "2"}</span><button class="big plain" data-go="deck">${due ? "Practise · " + due + " cards" : "Cards: done for today"}</button></div>
    </div></div></div>
  <h2>All stories</h2>
  ${DATA.stories.map(x => `<div class="row"><div class="pic">${x.cover}</div><div><h3>${esc(x.title)}</h3><div class="btns">
    <button class="pill" data-go="story:${x.id}">Read</button><button class="pill" data-go="ex:${x.id}">Questions</button></div></div></div>`).join("")}
  <div class="foot"><button data-go="teacher">For the teacher</button></div>`;
}

/* ---- story ---- */
function words(story, text, lead) {
  const bits = text.split(/([A-Za-z]+(?:’[A-Za-z]+)?)/).map((p, i) => i % 2 ? `<span class="w${story.dict[slug(p)] ? " pw" : ""}" data-w="${p}">${p}</span>` : esc(p));
  return `<span class="nb">${lead}${bits[0]}${bits[1] || ""}</span>` + bits.slice(2).join("");   // the button never parts from its first word
}
function storyScreen(id, n) {
  const s = DATA.stories.find(x => x.id === id), p = s.pages[n], last = n === s.pages.length - 1;
  app.innerHTML = `<div class="bar"><button class="pill" data-go="home">Home</button><h1>${esc(s.title)}</h1>
    <button class="pill ${slow ? "on" : ""}" id="slow">Slow</button></div>
  <div class="page"><div class="pic">${p.svg}</div>
  <div class="units">${p.units.map((u, k) => `<span class="unit${u.br ? " brk" : ""}" data-k="${k}"><span class="txt">${words(s, u.t, `<button class="spk" aria-label="Listen" data-a="${u.a}">${SPK}</button>`)}</span> </span>`).join("")}</div>
  <div class="nav"><button class="big plain" ${n ? "" : "style='visibility:hidden'"} data-go="story:${id}:${n - 1}">Back</button>
    <div class="dots">${s.pages.map((_, i) => `<span class="dot ${i === n ? "on" : ""}"></span>`).join("")}</div>
    <button class="big" data-go="${last ? "end:" + id : "story:" + id + ":" + (n + 1)}">${last ? "The end" : "Next"}</button></div></div>`;
  $("#slow").onclick = () => { slow = !slow; $("#slow").classList.toggle("on", slow); };
  app.querySelectorAll(".spk").forEach(b => b.onclick = () => {
    app.querySelectorAll(".unit.playing").forEach(x => x.classList.remove("playing"));
    const u = b.closest(".unit"); u.classList.add("playing"); sayUnit(id, b.dataset.a, () => u.classList.remove("playing"));
  });
  app.querySelectorAll(".w").forEach(w => w.onclick = () => {
    app.querySelectorAll(".w.hit").forEach(x => x.classList.remove("hit")); w.classList.add("hit");
    sayWord(id, w.dataset.w, () => w.classList.remove("hit"));
    const pic = s.dict[slug(w.dataset.w)]; if (pic) popup(pic.svg, pic.word);
  });
}
function popup(svg, word) {
  const d = document.createElement("div"); d.className = "pop"; d.innerHTML = `<div class="box"><div>${svg}</div><b>${esc(word)}</b></div>`;
  d.onclick = () => d.remove(); document.body.appendChild(d);
}
function endScreen(id) {
  const s = DATA.stories.find(x => x.id === id), t = today();
  state.read[id] = (state.read[id] || []).concat((state.read[id] || []).includes(t) ? [] : [t]); save();
  app.innerHTML = `<div class="bar"><button class="pill" data-go="home">Home</button><h1>${esc(s.title)}</h1></div>
  <div class="cardbox"><div class="sent">The end</div><div class="two">
    <button class="big plain" data-go="story:${id}">Read again</button><button class="big" data-go="ex:${id}">Questions</button><button class="big plain" data-go="home">Home</button></div></div>`;
}

/* ---- questions (apart from the story) ---- */
function exScreen(id) {
  const s = DATA.stories.find(x => x.id === id), e = s.ex;
  const pick = (grp, i, opts) => opts.map(o => `<button class="opt" data-grp="${grp}" data-i="${i}" data-v="${o}">${o}</button>`).join("");
  app.innerHTML = `<div class="bar"><button class="pill" data-go="home">Home</button><h1>Questions · ${esc(s.title)}</h1><button class="pill" data-go="story:${id}">Story</button></div>
  <div class="ex"><h3>1 &nbsp;Yes or no?</h3>${e.yesno.map((q, i) => `<div class="q" data-id="yn${i}"><span class="s">${esc(q.q)}</span>${pick("yn", i, ["yes", "no"])}<span class="mark"></span></div>`).join("")}</div>
  <div class="ex"><h3>2 &nbsp;Who said it?</h3>${e.who.map((q, i) => `<div class="q" data-id="wh${i}"><span class="s">${esc(q.q)}</span>${pick("wh", i, e.names)}<span class="mark"></span></div>`).join("")}</div>
  <div class="ex"><h3>3 &nbsp;Find the word in the story. Write it.</h3>${e.find.map((q, i) => `<div class="q" data-id="fd${i}"><span class="s">${q.base} → <input id="fd${i}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="past form of ${q.base}"></span><span class="mark"></span></div>`).join("")}</div>
  <div class="ex"><h3>4 &nbsp;Look at picture 8. Who took the sandwich?</h3><div class="q" data-id="last"><span class="s"><input id="last" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="who"> took it.</span><span class="mark"></span></div></div>
  <div class="two"><button class="big" id="check">Check</button></div><p class="left" id="score"></p>`;
  const sel = {};
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = b.dataset.grp + b.dataset.i; sel[k] = b.dataset.v;
    app.querySelectorAll(`.opt[data-grp="${b.dataset.grp}"][data-i="${b.dataset.i}"]`).forEach(x => x.classList.toggle("sel", x === b));
  });
  let tries = 0;
  $("#check").onclick = () => {
    const res = {}; let right = 0, total = 0;
    const mark = (id, ok, blank) => { const q = $(`.q[data-id="${id}"]`); total++; if (ok) right++; res[id] = blank ? null : ok;
      q.classList.toggle("ok", ok); q.classList.toggle("bad", !ok && !blank); $(".mark", q).textContent = blank ? "" : ok ? "✓" : "✗"; };
    e.yesno.forEach((q, i) => mark("yn" + i, sel["yn" + i] === q.a, !sel["yn" + i]));
    e.who.forEach((q, i) => mark("wh" + i, sel["wh" + i] === q.a, !sel["wh" + i]));
    e.find.forEach((q, i) => { const v = $("#fd" + i).value.trim().toLowerCase(); mark("fd" + i, v === q.a, !v); });
    const v = $("#last").value.trim().toLowerCase().replace(/^the /, ""); mark("last", e.last.includes(v), !v);
    tries++;
    const typed = {}; e.find.forEach((q, i) => typed[q.base] = $("#fd" + i).value.trim()); typed.last = $("#last").value.trim();
    const rec = state.ex[id] || (state.ex[id] = []); rec.push({ date: today(), tryNo: tries, right, total, typed }); save();
    $("#score").textContent = right === total ? "All right. Well done!" : right + " of " + total + ". Look at the story again and fix the red ones.";
  };
}

/* ---- practice cards ---- */
function deckScreen() {
  let pile = dueCards(), again = [];
  const next = () => {
    if (!pile.length) { pile = again; again = []; }
    if (!pile.length) { app.innerHTML = `<div class="bar"><button class="pill" data-go="home">Home</button><h1>Practise</h1></div>
      <div class="cardbox"><div class="sent">Done for today!</div><div class="two"><button class="big" data-go="home">Home</button></div></div>`; return; }
    show(pile.shift(), false);
  };
  const show = (c, open) => {
    const blank = '<span class="blank"></span>';
    const body = c.kind === "pic"
      ? `<div class="picw">${c.svg}</div><div class="sent">${open ? `<span class="ans">${esc(c.word)}</span>` : "What is it?"}</div>`
      : `<div class="verb">${esc(c.base)}</div><div class="sent">${c.parts.map((p, i) => i % 2 ? (open ? `<span class="ans">${esc(p)}</span>` : blank) : esc(p)).join("")}</div>`;
    app.innerHTML = `<div class="bar"><button class="pill" data-go="home">Home</button><h1>Practise</h1></div>
    <div class="cardbox">${body}${c.jp ? `<div class="jp">${esc(c.jp)}</div>` : ""}
      ${open ? `<div class="two"><button class="spk" style="width:54px;height:54px" id="hear" aria-label="Listen">${SPK}</button></div>
        <div class="two"><button class="big plain" id="no">Not yet</button><button class="big" id="yes">I knew it</button></div>`
      : `<p class="note">Say it. Then look.</p><div class="two"><button class="big" id="open">Show</button></div>`}</div>
    <p class="left">${pile.length + again.length + 1} to go</p>`;
    const hear = () => c.kind === "pic" ? sayWord(c.story, c.audio) : say([{ src: "audio/" + c.story + "/" + c.audio + ".mp3", rate: 1 }]);
    if (!open) { $("#open").onclick = () => { show(c, true); hear(); }; return; }
    $("#hear").onclick = hear;
    const done = knew => {
      const s = state.cards[c.id] || (state.cards[c.id] = { box: 0, seen: 0, miss: 0, first: today() });
      s.seen++; s.last = today();
      if (knew) { s.box = Math.min(s.box + 1, STEPS.length - 1); s.due = addDays(today(), STEPS[s.box]); }
      else { s.miss++; s.box = 0; s.due = today(); again.push(c); }
      save(); next();
    };
    $("#yes").onclick = () => done(true); $("#no").onclick = () => done(false);
  };
  next();
}

/* ---- teacher ---- */
function teacherScreen() {
  const rows = DATA.deck.map(c => { const s = state.cards[c.id]; return `<tr><td>${esc(c.label)}</td><td>${s ? s.seen : 0}</td><td>${s ? s.miss : 0}</td><td>${s ? s.box : "–"}</td><td>${s ? s.due : "new"}</td></tr>`; }).join("");
  const ex = Object.entries(state.ex).map(([id, recs]) => recs.map(r => `<tr><td>${id}</td><td>${r.date}</td><td>${r.tryNo}</td><td>${r.right} / ${r.total}</td><td>${esc(Object.entries(r.typed).map(([k, v]) => k + ": " + (v || "–")).join(" · "))}</td></tr>`).join("")).join("");
  const read = Object.entries(state.read).map(([id, ds]) => `<tr><td>${id}</td><td>${ds.join(", ")}</td></tr>`).join("");
  app.innerHTML = `<div class="bar"><button class="pill" data-go="home">Home</button><h1>For the teacher</h1></div>
  <p class="note">Everything here is stored on this device only. Nothing is sent anywhere. Version ${DATA.version}.</p>
  <h2>Cards</h2><table><tr><th>Card</th><th>Seen</th><th>Not yet</th><th>Step</th><th>Next</th></tr>${rows}</table>
  <h2>Questions</h2><table><tr><th>Story</th><th>Date</th><th>Try</th><th>Right</th><th>What he typed</th></tr>${ex || '<tr><td colspan="5">Not done yet.</td></tr>'}</table>
  <h2>Stories read</h2><table><tr><th>Story</th><th>Dates</th></tr>${read || '<tr><td colspan="2">Not read to the end yet.</td></tr>'}</table>
  <div class="foot"><button id="wipe">Erase everything on this device</button> <span id="sure"></span></div>`;
  $("#wipe").onclick = () => { $("#sure").innerHTML = '<button id="yeswipe">Yes, erase</button>'; $("#yeswipe").onclick = () => { state = { cards: {}, ex: {}, read: {} }; save(); teacherScreen(); }; };
}

/* ---- moving around ---- */
function go(where) {
  player.pause(); queue = []; window.scrollTo(0, 0);
  const [a, b, c] = where.split(":");
  if (a === "story") storyScreen(b, +(c || 0)); else if (a === "end") endScreen(b); else if (a === "ex") exScreen(b);
  else if (a === "deck") deckScreen(); else if (a === "teacher") teacherScreen(); else home();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });
go(location.hash ? location.hash.slice(1) : "home");
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
